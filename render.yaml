services:
  - type: web
    name: plataforma-incidencias
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        value: Data Source=incidencias.db
      - key: Algolia__AppId
        sync: false
      - key: Algolia__AdminKey
        sync: false
      - key: Algolia__SearchKey
        sync: false
      - key: Algolia__IndexName
        value: incidencias
      - key: Redis__ConnectionString
        sync: false
      - key: PieHost__ChannelUrl
        sync: false
      - key: PieHost__ChannelKey
        sync: false
